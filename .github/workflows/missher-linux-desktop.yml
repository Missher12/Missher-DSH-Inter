name: Missher Ubuntu Desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/desktop/**
      - scripts/libreoffice-*
      - .github/workflows/missher-linux-desktop.yml

permissions:
  contents: read

concurrency:
  group: missher-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
            workdir: .
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ${{ matrix.workdir }}
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_GATE_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libfuse2t64 xvfb fakeroot
      - run: pnpm install --frozen-lockfile
      - name: Check platform selection and packaging boundaries
        run: pnpm exec vitest run apps/desktop/tests/community-shell-raster.spec.ts apps/desktop/tests/community-shell-readiness.spec.ts apps/desktop/tests/community-package.spec.ts apps/desktop/tests/package-target.spec.ts apps/desktop/tests/desktop-build-paths.spec.ts apps/desktop/tests/desktop-package-environment.spec.ts apps/desktop/tests/cli-launcher.spec.ts apps/desktop/tests/installer-packaging.spec.ts scripts/libreoffice-engine.spec.ts scripts/build-exe-for-python-sdk-office.spec.ts apps/desktop/tests/runtime-file-policy.spec.ts --maxWorkers=2
      - name: Build Linux runtime
        if: runner.os == 'Linux'
        run: |
          cp apps/desktop/.env.linux.example apps/desktop/.env.linux
          pnpm run package:desktop:linux:x64
      - name: Install Debian package and verify visible renderer
        if: runner.os == 'Linux'
        run: |
          artifacts=apps/desktop/.desktop-build/targets/linux-x64/unsigned-artifacts
          deb=$(realpath "$artifacts/"*.deb)
          sudo apt-get install -y "$deb"
          xvfb-run -a -s '-screen 0 1440x1000x24' node apps/desktop/scripts/smoke-community-shell.mjs "$(command -v deepseek-harness)" desktop-verification
      - name: Upload verified installers and evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: missher-${{ matrix.target }}-verified
          compression-level: 0
          path: |
            ${{ matrix.workdir }}/apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.deb
            ${{ matrix.workdir }}/apps/desktop/.desktop-build/targets/${{ matrix.target }}/unsigned-artifacts/*.AppImage
            ${{ matrix.workdir }}/desktop-verification/
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: missher-${{ matrix.target }}-diagnostics
          path: |
            ${{ matrix.workdir }}/apps/desktop/.desktop-build/packaging-runs/
            ${{ matrix.workdir }}/desktop-verification/
